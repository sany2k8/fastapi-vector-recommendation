name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: recsys
          POSTGRES_PASSWORD: recsys
          POSTGRES_DB: recsys
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U recsys -d recsys"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://recsys:recsys@localhost:5439/recsys
      EMBEDDING_PROVIDER: local_hash
      EMBEDDING_DIM: "512"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv venv && uv pip install -e ".[dev]"

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest -q

      - name: Build image
        run: docker build -t vector-recsys:ci .
