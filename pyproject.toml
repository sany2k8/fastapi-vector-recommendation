[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vector-recsys"
version = "0.1.0"
description = "Multimodal (text + image) product recommendation API built on FastAPI and pgvector"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "httpx>=0.28",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "numpy>=2.1",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "mypy>=1.13",
    "faker>=33.0",
    "types-pillow>=10.2",
]

[project.scripts]
recsys = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "N999"]
"tests/*" = ["E501"]
# Catalogue prose reads better unwrapped than hard-wrapped at 100 columns.
"app/seeding/catalog_data.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires a running Postgres with pgvector"]
